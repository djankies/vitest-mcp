version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Conventional commit prefixes drive semantic-release: runtime dependency
    # updates ship as a patch release, dev dependency updates release nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      # One PR for routine updates instead of one per package
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the minimum supported Node version (engines.node)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
