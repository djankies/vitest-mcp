# Releases are fully automated by semantic-release (config: .releaserc.json).
# On every push to main it reads the Conventional Commits since the last tag,
# picks the version (fix → patch, feat → minor, BREAKING CHANGE / "!" → major),
# updates CHANGELOG.md and package.json, tags, publishes to npm and creates the
# GitHub release. Pushes with no feat/fix/perf/breaking commits release nothing.
#
# The file name must stay `publish.yml`: npm trusted publishing is bound to it.
name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on pull requests included in the release
      id-token: write # npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
